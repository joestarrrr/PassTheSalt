spring.application.name=passthesalt-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# Database configuration - prefer a full JDBC URL if provided (e.g. Railway's DATABASE_URL)
# Fallback to constructing from PGHOST/PGPORT/PGDATABASE environment variables
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:passthesalt}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Note: H2 configuration is kept in application-h2.properties and is NOT active by default.

clerk.frontend-api-url=https://wanted-kite-82.clerk.accounts.dev
clerk.jwks-uri=${clerk.frontend-api-url}/.well-known/jwks.json
clerk.api-base-url=https://api.clerk.com/v1
clerk.secret-key=${CLERK_SECRET_KEY:}
# Set CLERK_SECRET_KEY in your environment so the backend can resolve Clerk users by id.
#+ Example (PowerShell):
# $env:CLERK_SECRET_KEY = 'sk_...'

