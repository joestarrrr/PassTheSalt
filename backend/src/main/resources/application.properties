spring.application.name=passthesalt-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# Databaskonfiguration - Railway-variabler eller lokal Postgres fallback
# Railway: PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE miljövariabler
# Lokal: faller tillbaka på localhost:5432 om env-variabler inte är satta
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:passthesalt}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate inställningar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

